[project]
name = "customer-mcp-server"
version = "0.1.0"
description = "Customer support MCP server with strict validation over stdio"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
